<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ chatbot_title }}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 15% 20%, rgba(91, 76, 255, .22), transparent 28%),
                radial-gradient(circle at 85% 80%, rgba(0, 205, 190, .16), transparent 30%),
                #090b16;
            color: #f7f8ff;
            display: grid;
            place-items: center;
            padding: 22px;
        }
        .app {
            width: min(960px, 100%);
            height: min(760px, calc(100vh - 44px));
            min-height: 600px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 28px;
            background: rgba(16, 19, 34, .82);
            backdrop-filter: blur(24px);
            box-shadow: 0 30px 100px rgba(0,0,0,.45);
        }
        header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 20px 24px;
            border-bottom: 1px solid rgba(255,255,255,.08);
        }
        .orb {
            width: 46px;
            height: 46px;
            border-radius: 15px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #7667ff, #1bd7c4);
            box-shadow: 0 8px 30px rgba(72, 82, 255, .35);
            font-size: 21px;
        }
        header h1 { margin: 0; font-size: 18px; }
        header p { margin: 4px 0 0; color: #9da3bd; font-size: 12px; }
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 26px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .msg {
            max-width: 78%;
            padding: 14px 17px;
            border-radius: 18px;
            line-height: 1.55;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .bot {
            align-self: flex-start;
            background: #1a1f35;
            border-bottom-left-radius: 5px;
            color: #e9ebf7;
        }
        .user {
            align-self: flex-end;
            background: linear-gradient(135deg, #6559ff, #3e8dff);
            border-bottom-right-radius: 5px;
        }
        .typing { opacity: .65; font-style: italic; }
        form {
            display: flex;
            gap: 10px;
            padding: 18px;
            border-top: 1px solid rgba(255,255,255,.08);
            background: rgba(10, 12, 24, .7);
        }
        textarea {
            flex: 1;
            resize: none;
            height: 54px;
            border: 1px solid rgba(255,255,255,.1);
            outline: none;
            border-radius: 16px;
            padding: 15px 16px;
            color: #fff;
            background: #111528;
            font: inherit;
        }
        textarea:focus { border-color: rgba(119, 104, 255, .75); }
        button {
            width: 54px;
            border: 0;
            border-radius: 16px;
            cursor: pointer;
            color: #fff;
            background: linear-gradient(135deg, #7667ff, #1bd7c4);
            font-size: 19px;
        }
        button:disabled { opacity: .5; cursor: not-allowed; }
        @media (max-width: 650px) {
            body { padding: 0; }
            .app { height: 100vh; min-height: 100vh; border-radius: 0; }
            .msg { max-width: 90%; }
        }
    </style>
</head>
<body>
<div class="app">
    <header>
        <div class="orb">✦</div>
        <div>
            <h1>{{ chatbot_title }}</h1>
            <p>Focused learning and domain assistant powered by Gemini</p>
        </div>
    </header>

    <main id="messages">
        <div class="msg bot">Hello! I’m your {{ chatbot_title }}. Ask me a question related to my specialized topic.</div>
    </main>

    <form id="chat-form">
        <textarea id="message" placeholder="Type your question..." aria-label="Message"></textarea>
        <button id="send" type="submit" aria-label="Send">➤</button>
    </form>
</div>

<script>
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message");
    const messages = document.getElementById("messages");
    const send = document.getElementById("send");

    function addMessage(text, type) {
        const el = document.createElement("div");
        el.className = `msg ${type}`;
        el.textContent = text;
        messages.appendChild(el);
        messages.scrollTop = messages.scrollHeight;
        return el;
    }

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const message = input.value.trim();
        if (!message) return;

        addMessage(message, "user");
        input.value = "";
        send.disabled = true;

        const typing = addMessage("Thinking...", "bot typing");

        try {
            const response = await fetch("/api/chat", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({message})
            });
            const data = await response.json();
            typing.remove();
            addMessage(data.response || data.error || "Something went wrong.", "bot");
        } catch {
            typing.remove();
            addMessage("Could not connect to the server. Please try again.", "bot");
        } finally {
            send.disabled = false;
            input.focus();
        }
    });

    input.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            form.requestSubmit();
        }
    });
</script>
</body>
</html>
